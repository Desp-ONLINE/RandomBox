  rows: 3
  slots: [13]
  black-pane-slots: [0, 1, 2, 3, 5, 6, 7, 8, 18, 19, 20, 21, 23, 24, 25, 26]
  gray-pane-slots: [9, 10, 11, 15, 16, 17]
  white-pane-slots: [4, 12, 14]
  return-slot: 22
  next-slot: 17
  previous-slot: 9
  completed:
    name: '<lgreen><openings>회 오픈</lgreen> <gray>(<white>완료</white>)</gray>'
    lore:
      - '<lgreen>정보:</lgreen>'
      - '<lgreen>  ▪ <lgray>보상: </lgray><reward_name></lgreen>'
    skin: a79a5c95ee17abfef45c8dc224189964944d560f19a44f19f8a46aef3fee4756
  incompleted:
    name: '<lyellow><openings>회 오픈</lyellow> <gray>(<white>진행중</white>)</gray>'
    lore:
      - '<lyellow>정보:</lyellow>'
      - '<lyellow>  ▪ <lgray>보상 수령까지: </lgray><openings_left><lgray>회 남았습니다.</lgray></lyellow>'
      - '<lyellow>  ▪ <lgray>보상: </lgray><reward_name></lyellow>'
